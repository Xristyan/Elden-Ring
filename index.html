<style>
/* Layout: phone-first, one screen. Full-bleed map; floating search + category strip on top; draggable bottom sheet (zones / list / quests / settings); detail sheet slides over it. Single dark look by choice. */
:root{
  --ink:#121416; --panel:#1b1c1d; --panel-2:#242527; --panel-3:#2e2f31; --line:#3a3b3d;

  --ok:#8fc58a; --warn:#e0a35a; --warn-bg:#2c2318;

  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --serif:"Cormorant Garamond","Iowan Old Style",Georgia,serif;

  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
html{height:100%;overflow:hidden;background:#161719}
body{height:100%}
#app{position:absolute;left:0;top:0;width:100%;height:var(--appH,100%);overflow:hidden}
body{background:#161719;color:var(--fg);font-family:var(--body);font-size:15px;overflow:visible;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
[hidden]{display:none!important}
svg.g{width:1em;height:1em;fill:currentColor;flex:none;display:block}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

#map{position:absolute;left:0;right:0;top:0;bottom:0;background:#14171a}
.leaflet-container{font-family:var(--body);background:#14171a}
#mk{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:450;transform-origin:0 0}
#mk.anim{transition:transform .25s cubic-bezier(0,0,.25,1)}

/* top */
.top{position:absolute;left:0;right:0;top:0;z-index:800;padding-top:calc(var(--st) + 8px);padding-left:max(12px,var(--sl));padding-right:max(12px,var(--sr));display:grid;gap:8px;pointer-events:none;padding-bottom:6px}
.top>*{pointer-events:auto}
.srow{display:flex;gap:8px}
.search{position:relative;flex:1;min-width:0}
.search input{width:100%;height:46px;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);border:1px solid var(--glass-hi);border-radius:23px;padding:0 40px 0 42px;outline:none;font-size:16px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.search input:focus{border-color:var(--gold-dim)}
.search svg{z-index:1;pointer-events:none;position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2}
.search .clr{position:absolute;right:4px;top:4px;width:36px;height:36px;border:0;background:none;color:var(--muted);font-size:20px}
.lbtn{height:46px;min-width:46px;border-radius:23px;border:1px solid var(--glass-hi);background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);padding:0 15px;font-size:14.5px;font-weight:600;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.35);display:inline-flex;align-items:center;justify-content:center}

/* ---------- state ---------- */

}
let vis=null; // cached visible list for current layer
rebuild();

let docRef=null, saveT=null;

}
(async()=>{

    else save();
  }catch(e){}
})();

/* ---------- map ---------- */
const BLANK="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==";
const map=L.map("map",{crs:L.CRS.Simple,minZoom:-1,maxZoom:5.5,zoomSnap:.25,zoomDelta:.5,attributionControl:false,zoomControl:false,maxBoundsViscosity:.8,bounceAtZoomLimits:false,tapHold:true});

const MB={M00:[0,0,9728,9216],M01:[512,1536,6912,8448],M10:[2816,1792,7936,7936]};
const boundsOf=(b,pad=0)=>L.latLngBounds(ll(b[0]-pad,b[3]+pad),ll(b[2]+pad,b[1]-pad));

let curM=null;
function setLayer(m,keep){
  const changed=curM!==m;
  if(changed&&curM) map.removeLayer(layers[curM]);
  if(changed) layers[m].addTo(map);
  curM=m; st.m=m; vis=null;
  map.setMaxBounds(boundsOf(MB[m],1200));
  if(changed&&!map._loaded){zone=null;startView();}
  else if(changed&&!keep){zone=null;fitLayer();}
  $("layerBtn").textContent=MSHORT[m];
  document.querySelectorAll("#menu button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===m));
  render();
}
const VKEY="tarnished-atlas-view";
function saveView(){try{const c=map.getCenter();localStorage.setItem(VKEY,JSON.stringify({m:curM,lat:c.lat,lng:c.lng,z:map.getZoom()}));}catch(e){}}
function startView(){
  let v=null;try{v=JSON.parse(localStorage.getItem(VKEY)||"null");}catch(e){}
  if(v&&v.m===curM&&isFinite(v.z)&&v.z>=0.75){map.setView([v.lat,v.lng],v.z,{animate:false});return;}
  const z=A.zones.find(z=>z.m===curM&&(curM!=="M00"||z.id==="limgrave"))||A.zones.find(z=>z.m===curM);
  map.fitBounds(boundsOf(z.b,60),{animate:false,paddingTopLeft:[0,110],paddingBottomRight:[0,peekH()]});
  if(map.getZoom()<1.25) map.setView(ll((z.b[0]+z.b[2])/2,(z.b[1]+z.b[3])/2),1.5,{animate:false});
}
let touched=false; map.on("dragstart zoomstart",()=>{if(map._loaded&&performance.now()>1500)touched=true;});
function fitLayer(){
  let b=[1e9,1e9,-1e9,-1e9]; A.zones.filter(z=>z.m===curM).forEach(z=>{b=[Math.min(b[0],z.b[0]),Math.min(b[1],z.b[1]),Math.max(b[2],z.b[2]),Math.max(b[3],z.b[3])];});
  map.fitBounds(boundsOf(b,150),{animate:false,paddingTopLeft:[0,110],paddingBottomRight:[0,peekH()]});
}
function flyPad(latlng,z){ // keep the target above the bottom sheet
  const sz=map.getSize(), off=(sheetVisibleH()-120)/2; const p=map.project(latlng,z).add([0,Math.max(0,off)]);
  map.flyTo(map.unproject(p,z),z,{duration:.55});
}

/* ---------- canvas markers ---------- */
const cv=$("mk"), ctx=cv.getContext("2d",{alpha:true});
const DPR=Math.min(devicePixelRatio||1,2);
const sprite=new Image(); sprite.src="icons.webp"; sprite.onload=()=>{stamps.clear();redraw();};
let drawn=[], rafId=0;
function sizeCanvas(){map.invalidateSize({pan:false});const s=map.getSize();cv.width=Math.round(s.x*DPR);cv.height=Math.round(s.y*DPR);cv.style.height=s.y+"px";ctx.setTransform(DPR,0,0,DPR,0,0);}
function visible(){
  if(vis) return vis;
  vis=ALL.filter(p=>p.m===curM&&enabled.has(p.cat)&&!(st.hideFound&&st.found[p.id]&&p.id!==sel));
  return vis;
}
const radius=z=>z<0?5:z<1?6.5:z<2?9:z<3?11:z<4?13:15;
// pre-rendered marker stamps: one drawImage per marker instead of paths
const stamps=new Map();
function stamp(p,R,f){
  const icon=!f&&R>=13&&p.info&&p.info.i!=null&&sprite.naturalWidth;
  const key=(icon?"i"+p.info.i:p.cat)+"|"+R+"|"+(f?1:0);
  let c=stamps.get(key); if(c) return c;
  const pad=5, S=Math.ceil((R+pad)*2*DPR); c=document.createElement("canvas"); c.width=c.height=S;
  const g=c.getContext("2d"); g.scale(DPR,DPR); const o=R+pad, col=(CATS[p.cat]||CATS.custom).c;
  g.save();g.shadowColor="rgba(0,0,0,.55)";g.shadowBlur=R>8?5:3;g.shadowOffsetY=1.5;g.beginPath();g.arc(o,o,R,0,7);g.fillStyle=f?"#3a3b3d":icon?"#4a463e":col;g.fill();g.restore();
  g.lineWidth=p.cat==="boss"?(R>8?3:2):R>8?2:1.4;g.strokeStyle=f?"#8fc58a":icon?col:p.cat==="boss"?"#fff3c4":"rgba(255,255,255,.92)";g.beginPath();g.arc(o,o,R-.5,0,7);g.stroke();
  if(R>=9){
    if(f){g.strokeStyle="#8fc58a";g.lineWidth=2.6;g.lineCap="round";g.beginPath();g.moveTo(o-R*.42,o);g.lineTo(o-R*.1,o+R*.34);g.lineTo(o+R*.45,o-R*.36);g.stroke();}
    else if(icon){const Ss=A.spriteSize,cols=A.spriteCols,k=p.info.i,s=R*1.75;g.save();g.beginPath();g.arc(o,o,R-1.5,0,7);g.clip();g.drawImage(sprite,(k%cols)*Ss,Math.floor(k/cols)*Ss,Ss,Ss,o-s/2,o-s/2,s,s);g.restore();}
    else{const P=P2D[p.cat]||P2D.custom,s=R*1.32;g.save();g.translate(o-s/2,o-s/2);g.scale(s/512,s/512);g.fillStyle="#15130f";g.fill(P);g.restore();}
  }
  c._o=o; stamps.set(key,c); return c;
}
function draw(){
  rafId=0; const sz=map.getSize(), W=sz.x, H=sz.y; ctx.clearRect(0,0,W,H);
  drawn=[]; const z=map.getZoom(), R=radius(z), k=Math.pow(2,z), org=map.getPixelOrigin(), pane=map._getMapPanePos();
  const ox=org.x-pane.x, oy=org.y-pane.y; // container = unit*k - (origin - panePos)
  const declutter=z<2.5, cell=R*2.1, occ=declutter?new Set():null, dim=!!(openQ||openR);
  ctx.globalAlpha=dim?.3:1;
  let selD=null;
  for(const p of visible()){
    const x=p.u*k-ox, y=p.v*k-oy; if(x<-30||y<-30||x>W+30||y>H+30) continue;
    if(p.id===sel){selD={p,x,y};drawn.push(selD);continue;}
    if(declutter){const key=((x/cell)|0)+","+((y/cell)|0); if(occ.has(key)) continue; occ.add(key);}
    const f=!!st.found[p.id]; const s=stamp(p,p.cat==="boss"?R+3:R,f);
    if(zone&&p.zone!==zone&&!dim){ctx.globalAlpha=.3;ctx.drawImage(s,x-s._o,y-s._o,s.width/DPR,s.height/DPR);ctx.globalAlpha=1;}
    else ctx.drawImage(s,x-s._o,y-s._o,s.width/DPR,s.height/DPR);
    drawn.push({p,x,y});
  }
  ctx.globalAlpha=1;
  if(st.labels&&z<2.4){
    ctx.textAlign="center";ctx.textBaseline="middle";ctx.lineJoin="round";
    ctx.font=`700 ${z<0?14:z<1?17:21}px "Cormorant Garamond",Georgia,serif`;
    for(const zz of A.zones){ if(zz.m!==curM||(z<1.25&&(zz.id==="leyndell"||zz.id==="gelmir"))) continue;
      const x=zz.x/SC*k-ox, y=zz.y/SC*k-oy-22; if(x<-200||x>W+200||y<-40||y>H+40) continue;
      const t=zz.label.toUpperCase(); ctx.lineWidth=5;ctx.strokeStyle="rgba(12,13,14,.88)";ctx.strokeText(t,x,y);ctx.fillStyle=zone===zz.id?"#f3d88f":"#eadfbf";ctx.fillText(t,x,y);}
  }
  if(openR) drawRoute(R,k,ox,oy);
  if(openQ) drawQuest(R,k,ox,oy);
  if(selD){const s=stamp(selD.p,R+3,!!st.found[selD.p.id]);ctx.beginPath();ctx.arc(selD.x,selD.y,R+10,0,7);ctx.fillStyle="rgba(216,182,100,.28)";ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle="#f3d88f";ctx.stroke();ctx.drawImage(s,selD.x-s._o,selD.y-s._o,s.width/DPR,s.height/DPR);}
}
function drawQuest(R,k,ox,oy){
  const q=QBY[openQ]; if(!q) return; const done=st.q[q.id]||{}, cur=curStep(q);
  const pts=q.steps.filter(s=>s.x!=null&&s.m===curM).map(s=>({s,x:s.x/SC*k-ox,y:s.y/SC*k-oy}));
  ctx.setLineDash([7,7]);ctx.lineWidth=3;ctx.strokeStyle=q.color;ctx.globalAlpha=.85;ctx.beginPath();
  pts.forEach((o,i)=>i?ctx.lineTo(o.x,o.y):ctx.moveTo(o.x,o.y));ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
  const r=Math.max(R+2,13);
  ctx.textAlign="center";ctx.textBaseline="middle";ctx.font=`700 ${Math.round(r*1.05)}px "Alegreya Sans",system-ui,sans-serif`;
  for(const o of pts){const d=!!done[o.s.n];
    if((cur&&cur.n===o.s.n)||selStep===o.s.n){ctx.beginPath();ctx.arc(o.x,o.y,r+8,0,7);ctx.fillStyle=q.color+"55";ctx.fill();}
    ctx.beginPath();ctx.arc(o.x,o.y,r,0,7);ctx.fillStyle=d?q.color:"#1c1d1f";ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=q.color;ctx.stroke();
    ctx.fillStyle=d?"#14120f":"#f1ead9";ctx.fillText(String(o.s.n),o.x,o.y+1);
    drawn.push({qs:o.s,x:o.x,y:o.y});}
}
const redraw=()=>{if(!rafId) rafId=requestAnimationFrame(draw);};
map.on("move zoom",()=>{if(!cv.classList.contains("anim")) redraw();});
map.on("zoomanim",e=>{const s=map.getZoomScale(e.zoom,map.getZoom()),sz=map.getSize(),c0=map.latLngToContainerPoint(e.center);
  cv.classList.add("anim");cv.style.transform=`translate(${sz.x/2-s*c0.x}px,${sz.y/2-s*c0.y}px) scale(${s})`;});
map.on("zoomend",()=>{cv.classList.remove("anim");cv.style.transform="";if(rafId){cancelAnimationFrame(rafId);rafId=0;}draw();});
map.on("resize",()=>{sizeCanvas();redraw();});
map.on("moveend",()=>{clearTimeout(window._vt);window._vt=setTimeout(saveView,400);});
// iOS home-screen apps can report a viewport shorter than the screen; stretch fixed layers over the gap
function fixViewport(){
  const sa=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
  const vh=Math.min(innerHeight,document.documentElement.clientHeight||innerHeight), portrait=innerHeight>innerWidth;
  let gap=0; if(sa&&portrait&&screen.height>vh) gap=Math.max(0,Math.min(100,screen.height-vh));
  const H=gap?screen.height:innerHeight;
  document.documentElement.style.setProperty("--appH",H+"px");
  window._diag=`екран ${screen.width}×${screen.height} · прозорец ${innerWidth}×${innerHeight} · layout ${document.documentElement.clientHeight} · app ${H} · ${sa?"приложение":"браузър"}`;
  const before=map.getSize().y; map.invalidateSize({pan:false}); sizeCanvas(); snap(sheetState);
  if(!touched&&performance.now()<4000&&Math.abs(map.getSize().y-before)>2) startView();
  redraw();
}
addEventListener("pageshow",fixViewport); addEventListener("resize",()=>setTimeout(fixViewport,50)); addEventListener("orientationchange",()=>setTimeout(fixViewport,300));
document.addEventListener("visibilitychange",()=>{if(!document.hidden)setTimeout(fixViewport,100);});
function hit(cp){const R=radius(map.getZoom())+14;let best=null,bd=R*R;
  for(let i=drawn.length-1;i>=0;i--){const d=drawn[i],dx=d.x-cp.x,dy=d.y-cp.y,dd=dx*dx+dy*dy;if(dd<bd||(dd===bd&&d.qs)){bd=dd;best=d;}}return best;}
map.on("click",e=>{
  $("menu").hidden=true;
  if(adding){newPin(e.latlng);return;}
  const h=hit(e.containerPoint);
  if(h&&h.ro){showObj(h.ro);return;}
  if(h&&h.qs){selStep=h.qs.n;sel=null;closeCard();setTab("q");snap("half");redraw();setTimeout(()=>{const el=$("step-"+h.qs.n);if(el)el.scrollIntoView({block:"center",behavior:"smooth"});},60);return;}
  if(h) select(h.p.id); else {if(sel) closeCard(); else if(sheetState!=="peek") snap("peek");}
});
map.on("contextmenu",e=>newPin(e.latlng));
map.on("dragstart",()=>{$("menu").hidden=true;if(sheetState==="full")snap("peek");});

/* ---------- bottom sheets ---------- */
const sheet=$("sheet"), card=$("card");
let sheetState="peek";
const peekH=()=>$("grab").offsetHeight+ (parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--sb"))||0);
function sheetY(state){const H=sheet.offsetHeight;return state==="full"?0:state==="half"?Math.round(H*.45):H-$("grab").offsetHeight;}
function sheetVisibleH(){return card.hidden?sheet.offsetHeight-sheetY(sheetState):card.offsetHeight;}
function snap(state){sheetState=state;sheet.classList.add("snap");sheet.style.setProperty("--y",sheetY(state)+"px");
  document.documentElement.style.setProperty("--peek",(sheet.offsetHeight-sheetY(state==="full"?"half":state))+"px");}
function dragSheet(el,getY,setY,onEnd){
  let sy=0,y0=0,drag=false,t0=0,id=null;
  el.addEventListener("pointerdown",e=>{if(e.target.closest("button,input,textarea,a"))return;id=e.pointerId;sy=e.clientY;y0=getY();drag=false;t0=performance.now();});
  el.addEventListener("pointermove",e=>{if(e.pointerId!==id)return;const dy=e.clientY-sy;if(!drag&&Math.abs(dy)>6){drag=true;el.setPointerCapture(id);el.closest(".sheet").classList.remove("snap");}if(drag)setY(Math.max(0,y0+dy));});
  const end=e=>{if(e.pointerId!==id)return;id=null;if(!drag){onEnd(null);return;}const v=(e.clientY-sy)/(performance.now()-t0);onEnd(y0+(e.clientY-sy),v);};

function routeObj(key){const [pid,i]=key.split("|");const ph=ROUTE.find(p=>p.id===pid);return {ph,o:ph.o[+i],i:+i};}
function toggleObj(o){if(o[0]==="q"){const d=(st.q[o[1]]??={});if(d[o[2]])delete d[o[2]];else d[o[2]]=1;}else{if(st.found[o[1]])delete st.found[o[1]];else st.found[o[1]]=1;}save();}
function showObj(o){if(o[0]==="q"){const q=QBY[o[1]],s=q.steps.find(x=>x.n===o[2]);selStep=null;if(s.m!==curM)setLayer(s.m,true);flyPad(ll(s.x,s.y),Math.max(map.getZoom(),3));snap("peek");redraw();}else{select(o[1],true);}}
function drawRoute(R,k,ox,oy){
  const ph=ROUTE.find(p=>p.id===openR); if(!ph) return;
  const objs=phaseObjs(ph).filter(v=>v.x!=null&&v.m===curM);
  ctx.setLineDash([5,6]);ctx.lineWidth=2.5;ctx.strokeStyle="#d8b664";ctx.globalAlpha=.75;ctx.beginPath();
  objs.forEach((v,j)=>{const x=v.x/SC*k-ox,y=v.y/SC*k-oy;j?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
  const r=Math.max(R-1,9), nx=objs.find(v=>!v.done);
  ctx.textAlign="center";ctx.textBaseline="middle";ctx.font=`700 ${Math.round(r*.95)}px "Alegreya Sans",system-ui,sans-serif`;
  objs.forEach((v,j)=>{const x=v.x/SC*k-ox,y=v.y/SC*k-oy;
    if(v===nx){ctx.beginPath();ctx.arc(x,y,r+8,0,7);ctx.fillStyle="rgba(216,182,100,.35)";ctx.fill();}
    ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=v.done?"#3a3b3d":"#1c1d1f";ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle=v.done?"#8fc58a":(v.boss?"#d0564b":"#d8b664");ctx.stroke();
    ctx.fillStyle=v.done?"#8fc58a":"#f1ead9";ctx.fillText(v.done?"✓":String(j+1),x,y+1);
    drawn.push({ro:v.o,x,y});});
}

/* ---------- quests ---------- */
function renderQ(){
  const b=$("body");
  if(!openQ){
    const q0=query.toLowerCase(), list=QUESTS.filter(q=>!q0||(q.name+" "+q.steps.map(s=>s.t).join(" ")).toLowerCase().includes(q0));
    const row=q=>{const pr=qProg(q),cs=curStep(q),fin=!cs;
      return `<button class="qrow${fin?" fin":""}" type="button" data-q="${q.id}" style="--qc:${q.color}"><span class="dot"></span><b>${esc(q.name)}${q.dlc?'<span class="qtag">DLC</span>':""}</b><small>${pr}/${q.steps.length}</small>
       <span class="now">${fin?"✓ Завършен":pr?`Сега: <em>${cs.n}. ${esc(cs.t)}</em>`:"Не е започнат"}</span><span class="bar"><i style="width:${pr/q.steps.length*100}%"></i></span></button>`;};
    const act=list.filter(q=>qProg(q)>0&&curStep(q)), rest=list.filter(q=>!act.includes(q));
    b.innerHTML=`<div class="pad"><div class="help"><b>Как работи:</b> отвори куест и отмятай стъпките. На картата излизат номерирани точки до следващата. Не помниш докъде си? Виж къде стои NPC-то сега и какво казва, намери стъпката с това описание и натисни „Стигнал съм дотук“.</div></div>`+
     (act.length?`<div class="lg"><span>В процес</span><span>${act.length}</span></div>${act.map(row).join("")}`:"")+
     `<div class="lg"><span>Всички куестове</span><span>${rest.length}</span></div>${rest.map(row).join("")}`;
    return;
  }
  const q=QBY[openQ], d=st.q[q.id]||{}, cs=curStep(q);
  b.innerHTML=`<div class="qd" style="--qc:${q.color}">
    <div><button class="link" type="button" id="qback">← Всички куестове</button></div>
    <h2>${esc(q.name)}</h2><p class="ov">${esc(q.ov)}</p>
    ${q.pre?`<div class="note"><b>Внимание, може да се провали:</b> ${esc(q.pre)}</div>`:""}
    <div class="btns" style="align-items:center;justify-content:space-between"><span class="pct">${qProg(q)} от ${q.steps.length} стъпки</span><button class="link" type="button" id="qreset">Нулирай</button></div>
    <div>${q.steps.map(s=>{const dn=!!d[s.n],cur=cs&&cs.n===s.n;
      return `<div class="step${dn?" done":""}${cur?" cur":""}" id="step-${s.n}"><button class="num" type="button" data-sn="${s.n}" aria-pressed="${dn}" aria-label="Отметни стъпка ${s.n}">${dn?"✓":s.n}</button>
      <div class="sb"><div class="st">${esc(s.t)}${cur?'<span class="here">Ти си тук</span>':""}</div>
      <p>${esc(s.d)}</p>${s.r?`<div class="rw">Награда: ${esc(s.r)}</div>`:""}${s.w?`<div class="wn">⚠ ${esc(s.w)}</div>`:""}
      <div class="sa">${s.x!=null?`<button class="btn" type="button" data-go="${s.n}">На картата${s.m!==curM?" · "+MSHORT[s.m]:""}</button>`:""}${!dn?`<button class="btn" type="button" data-upto="${s.n}">Стигнал съм дотук</button>`:""}</div></div></div>`;}).join("")}</div></div>`;
}
function banner(){const b=$("qbanner"),q=openQ&&QBY[openQ];
  if(!q&&openR){const ph=ROUTE.find(p=>p.id===openR);const nx=phaseObjs(ph).find(v=>!v.done);b.hidden=false;b.style.setProperty("--qc","#d8b664");
    b.innerHTML=`<span><b>${esc(ph.t)}</b> · ${nx?esc(nx.t):"етапът е готов"}</span><button type="button" id="rclose" aria-label="Скрий маршрута от картата">×</button>`;return;}
  if(!q){b.hidden=true;return;}const cs=curStep(q);b.hidden=false;b.style.setProperty("--qc",q.color);
  b.innerHTML=`<span><b>${esc(q.name)}</b> · ${cs?`${cs.n}. ${esc(cs.t)}`:"завършен"}</span><button type="button" id="qclose" aria-label="Скрий куеста от картата">×</button>`;}
function openQuest(id,fly){
  openQ=id; st.qopen=id; selStep=null; openR=null; save(); setTab("q"); snap("half"); banner();
  const q=QBY[id], s=curStep(q)||q.steps[q.steps.length-1];
  if(fly&&s&&s.x!=null) goStep(s); else redraw();
}
function goStep(s){selStep=s.n; if(s.m!==curM) setLayer(s.m,true); flyPad(ll(s.x,s.y),Math.max(map.getZoom(),2.5)); redraw();}

/* ---------- events (delegated) ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.closest("#menu")){$("menu").hidden=true;if(t.dataset.m){sel=null;closeCard();setLayer(t.dataset.m);}return;}
  if(t.id==="layerBtn"){$("menu").hidden=!$("menu").hidden;return;}
  if(t.dataset.c){const k=t.dataset.c;enabled.has(k)?enabled.delete(k):enabled.add(k);save();render();return;}
  if(t.closest(".tabs")){setTab(t.dataset.tab);if(sheetState==="peek")snap("half");return;}
  if(t.dataset.z){const z=ZONES[t.dataset.z];if(zone===z.id){zone=null;fitLayer();}else{zone=z.id;snap("peek");map.flyToBounds(boundsOf(z.b,100),{duration:.55,paddingTopLeft:[0,110],paddingBottomRight:[0,peekH()]});}listLimit=80;render();return;}
  if(t.id==="allZones"){zone=null;fitLayer();render();return;}
  if(t.dataset.t){toggle(t.dataset.t);return;}
  if(t.dataset.id){select(t.dataset.id,true);snap("peek");return;}
  if(t.id==="more"){listLimit+=200;renderList();return;}
  if(t.dataset.m&&t.closest("#seg")){sel=null;closeCard();setLayer(t.dataset.m);return;}
  if(t.id==="preset"){enabled=new Set(PRESET);save();render();return;}
  if(t.id==="allCats"){enabled=new Set(ORDER);save();render();return;}
  if(t.id==="noCats"){enabled=new Set(["custom"]);save();render();return;}
  if(t.dataset.q){openQuest(t.dataset.q,true);return;}
  if(t.id==="rclose"){openR=null;render();return;}
  if(t.id==="qback"||t.id==="qclose"){openQ=null;st.qopen=null;selStep=null;save();render();return;}
  if(openQ&&(t.dataset.sn||t.dataset.upto||t.dataset.go||t.id==="qreset")){
    const q=QBY[openQ], d=(st.q[q.id]??={});
    if(t.dataset.go){goStep(q.steps.find(s=>s.n===+t.dataset.go));snap("peek");return;}
    if(t.id==="qreset") st.q[q.id]={};
    else if(t.dataset.sn){const n=+t.dataset.sn; if(d[n]) delete d[n]; else d[n]=1;}
    else {const n=+t.dataset.upto; q.steps.forEach(s=>{if(s.n<n) d[s.n]=1; else delete d[s.n];});}
    const sc=$("body").scrollTop; save(); render(); $("body").scrollTop=sc; return;
  }
  if(t.id==="pcopy"){const txt="ATLAS1:"+btoa(unescape(encodeURIComponent(JSON.stringify({found:st.found,notes:st.notes,custom:st.custom,q:st.q}))));
    const ok=()=>{$("pmsg").textContent="Копирано.";};
    try{navigator.clipboard.writeText(txt).then(ok,()=>{$("ptext").value=txt;$("ptext").select();$("pmsg").textContent="Маркирах текста, копирай го ръчно.";});}catch(e){$("ptext").value=txt;$("ptext").select();$("pmsg").textContent="Маркирах текста, копирай го ръчно.";}
    return;}
  if(t.id==="pload"){try{const v=$("ptext").value.trim();const j=JSON.parse(decodeURIComponent(escape(atob(v.replace(/^ATLAS1:/,"")))));
      st.found=Object.assign({},st.found,j.found||{});st.notes=Object.assign({},st.notes,j.notes||{});st.q=Object.assign({},st.q,j.q||{});
      const ids=new Set(st.custom.map(c=>c.id));(j.custom||[]).forEach(c=>{if(!ids.has(c.id))st.custom.push(c);});
      rebuild();save();render();$("pmsg").textContent="Заредено.";$("ptext").value="";}catch(e){$("pmsg").textContent="Текстът не е валиден прогрес. Копирай го отново.";}
    return;}
  if(t.id==="filterBtn"){$("menu").hidden=true;openFilters();return;}
  if(t.id==="fclose"||t.id==="fdone"){closeFilters();return;}
  if(t.dataset.rall!=null){rAll=t.dataset.rall==="1";st.rAll=rAll;save();renderRoute();redraw();return;}
  if(t.dataset.ph){rOpen=rOpen===t.dataset.ph?"":t.dataset.ph;const sc=$("body").scrollTop;renderRoute();$("body").scrollTop=sc;return;}
  if(t.dataset.rmap){openR=openR===t.dataset.rmap?null:t.dataset.rmap;if(openR){openQ=null;st.qopen=null;const ph=ROUTE.find(p=>p.id===openR),objs=phaseObjs(ph).filter(v=>v.x!=null);if(objs.length){const m=objs[0].m;if(m!==curM)setLayer(m,true);const xs=objs.filter(v=>v.m===m);let b0=[1e9,1e9,-1e9,-1e9];xs.forEach(v=>{b0=[Math.min(b0[0],v.x),Math.min(b0[1],v.y),Math.max(b0[2],v.x),Math.max(b0[3],v.y)];});snap("peek");map.flyToBounds(boundsOf(b0,80),{duration:.55,paddingTopLeft:[0,110],paddingBottomRight:[0,peekH()]});}}render();return;}
  if(t.dataset.rd){const r=routeObj(t.dataset.rd);toggleObj(r.o);const sc=$("body").scrollTop;render();$("body").scrollTop=sc;return;}
  if(t.dataset.ro){const r=routeObj(t.dataset.ro);showObj(r.o);return;}
  if(t.id==="addBtn"){setAdd(!adding);return;}
  if(t.id==="fitBtn"){zone=null;fitLayer();render();return;}
  if(t.id==="qclr"){$("q").value="";query="";$("qclr").hidden=true;listLimit=80;setTab("zones");render();return;}
});
document.addEventListener("change",e=>{
  if(e.target.id==="hideFound"){st.hideFound=e.target.checked;save();render();}
  if(e.target.id==="zoneLabels"){st.labels=e.target.checked;save();redraw();}
});
let qt;$("q").addEventListener("input",e=>{clearTimeout(qt);$("qclr").hidden=!e.target.value;qt=setTimeout(()=>{query=e.target.value.trim();listLimit=80;if(query&&sheetState==="peek")snap("half");if(!query&&tab==="list")tab="zones";renderTab();},180);});
$("scrim").addEventListener("click",closeFilters);
dragSheet($("fgrab"),()=>0,y=>$("fsheet").style.setProperty("--y",y+"px"),(y,v)=>{if(y==null)return;if(y>120||v>.6)closeFilters();else{$("fsheet").classList.add("snap");$("fsheet").style.setProperty("--y","0px");}});
$("q").addEventListener("keydown",e=>{if(e.key==="Enter")e.target.blur();});
addEventListener("keydown",e=>{if(e.key==="Escape"){if(!$("fsheet").hidden)closeFilters();else if(adding)setAdd(false);else closeCard();}});
addEventListener("resize",()=>{snap(sheetState);});

window.APPV="784f0e87";
if("serviceWorker" in navigator&&location.protocol==="https:"){
  let reloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(reloaded)return;reloaded=true;location.reload();});
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(reg=>{
    const chk=()=>reg.update().catch(()=>{}); chk();
    document.addEventListener("visibilitychange",()=>{if(!document.hidden)chk();});
  }).catch(()=>{});
}
sizeCanvas();
snap("peek");
setLayer(st.m||"M00");
if(document.fonts) document.fonts.ready.then(()=>{stamps.clear();redraw();snap(sheetState);});
setTimeout(fixViewport,60); setTimeout(fixViewport,600);
</script>
